<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Money Map — Foundation</title>
</head>
<body>
  <h1>Money Map</h1>
  <div id="status">Initializing…</div>

  <section id="transactions-section">
    <h2>Transactions</h2>

    <div id="transaction-filters">
      <label>
        Month
        <select id="filter-month"><option value="all">All months</option></select>
      </label>
      <label>
        From
        <input type="date" id="filter-date-from" />
      </label>
      <label>
        To
        <input type="date" id="filter-date-to" />
      </label>
      <label>
        Category
        <select id="filter-category"><option value="all">All categories</option></select>
      </label>
      <label>
        Type
        <select id="filter-type">
          <option value="all">All</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </label>
      <label>
        Search
        <input type="text" id="filter-search" placeholder="description, merchant…" />
      </label>
      <button type="button" id="filter-reset-btn">Reset filters</button>
    </div>

    <table id="transaction-table">
      <thead>
        <tr>
          <th data-sort="date">Date</th>
          <th>Description</th>
          <th data-sort="amount">Amount</th>
          <th>Category</th>
          <th>Method</th>
        </tr>
      </thead>
      <tbody id="transaction-table-body"></tbody>
    </table>
    <p id="transaction-empty-message" hidden>No transactions match these filters.</p>
  </section>

  <section id="import-section">
    <h2>Import ING CSV</h2>

    <form id="import-mapping-form"></form>

    <input type="file" id="import-file-input" accept=".csv,text/csv" />
    <button type="button" id="import-preview-btn">Load &amp; Preview</button>
    <p id="import-error"></p>

    <div id="import-review-list"></div>

    <button type="button" id="import-confirm-btn" disabled>Confirm Import</button>
    <p id="import-summary"></p>
  </section>

  <section id="rules-section">
    <h2>Categorization Rules</h2>

    <form id="rule-form">
      <label>
        Category
        <select id="rule-category"></select>
      </label>
      <label>
        Match type
        <select id="rule-match-type"></select>
      </label>
      <label>
        Match value
        <input type="text" id="rule-match-value" required />
      </label>
      <label>
        Priority
        <input type="number" id="rule-priority" value="0" />
      </label>
      <button type="submit" id="rule-submit-btn">Add rule</button>
      <button type="button" id="rule-cancel-edit-btn" hidden>Cancel</button>
    </form>
    <p id="rule-error"></p>

    <div id="rules-list"></div>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
